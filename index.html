<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מלאי ולוגיסטיקה · חדר בקרה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Rubik:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="ניווט ראשי">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-6 9 6v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M7 21v-8h10v8"/><path d="M7 17h10"/></svg></span>
      <div><b>חדר בקרה</b><span>מחסני חלקי חילוף</span></div>
    </div>
    <div class="nav">
      <a href="#overview" data-view="overview"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>סקירה</a>
      <a href="#inventory" data-view="inventory"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>מלאי<span class="badge" id="nav-attn"></span></a>
      <a href="#shipments" data-view="shipments"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 6h13v10H1z"/><path d="M14 9h4l4 4v3h-8"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg>משלוחים<span class="badge" id="nav-late"></span></a>
      <a href="#suppliers" data-view="suppliers"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 21v-6h6v6"/></svg>ספקים</a>
    </div>
    <div class="rail-foot">נתוני דמה. אין חיבור ל-ERP.<br><a href="https://github.com/E37dey/inventory-logistics-dashboard" style="color:inherit">הקוד ב-GitHub</a></div>
  </nav>

  <div class="main">
    <header class="top">
      <div>
        <h1 id="view-title">סקירה</h1>
        <div class="when" id="when"></div>
      </div>
      <div class="search" role="search">
        <label for="q" class="sr">חיפוש פריט</label>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="q" type="search" placeholder="חיפוש פריט לפי שם או מק״ט" autocomplete="off" aria-controls="q-results">
        <span class="kbd" aria-hidden="true">/</span>
        <ul class="results" id="q-results" hidden></ul>
      </div>
      <button type="button" class="basket-btn" id="basket-open" aria-haspopup="dialog">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6L5 3H2"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>
        סל הזמנה <span class="badge" id="basket-count">0</span>
      </button>
    </header>

    <section class="view" id="view-overview" aria-labelledby="view-title"></section>
    <section class="view" id="view-inventory" aria-labelledby="view-title"></section>
    <section class="view" id="view-shipments" aria-labelledby="view-title"></section>
    <section class="view" id="view-suppliers" aria-labelledby="view-title"></section>
  </div>
</div>

<script src="data.js"></script>
<script src="logic.js"></script>
<script src="js/charts.js"></script>
<script src="js/map.js"></script>
<script src="app.js"></script>
</body>
</html>
