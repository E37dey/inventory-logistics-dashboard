<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מלאי ולוגיסטיקה · דאשבורד מחסנים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="wrap">
  <header class="top">
    <div>
      <div class="tag"><span class="live" aria-hidden="true"></span><span>INVENTORY · LOGISTICS</span><span id="today"></span></div>
      <h1>מלאי ולוגיסטיקה</h1>
      <div class="sub">שלושה מחסנים · חלקי חילוף · נתוני דמה</div>
    </div>
  </header>

  <section class="kpis" id="kpis" aria-label="מדדים"></section>

  <div class="grid-2">
    <section class="panel" aria-labelledby="alerts-title">
      <div class="panel-head">
        <h2 id="alerts-title">להזמנה עכשיו</h2>
        <span class="count" id="alerts-count"></span>
      </div>
      <div class="panel-body">
        <ul class="alerts" id="alerts"></ul>
        <div class="order-bar">
          <span id="order-summary"></span>
          <button type="button" class="ghost" id="clear-marks">נקה סימונים</button>
        </div>
      </div>
    </section>

    <section class="panel" aria-labelledby="ship-title">
      <div class="panel-head">
        <h2 id="ship-title">משלוחים</h2>
        <div class="seg" role="group" aria-label="כיוון משלוח">
          <button type="button" data-dir="" aria-pressed="true">הכול</button>
          <button type="button" data-dir="inbound" aria-pressed="false">נכנסים</button>
          <button type="button" data-dir="outbound" aria-pressed="false">יוצאים</button>
        </div>
      </div>
      <div class="panel-body">
        <ul class="ships" id="ships"></ul>
      </div>
    </section>
  </div>

  <div class="grid-2">
    <section class="panel" aria-labelledby="chart-cat-title">
      <div class="panel-head"><h2 id="chart-cat-title">שווי מלאי לפי קטגוריה</h2><span class="count">₪</span></div>
      <div class="panel-body"><div class="hbars" id="chart-cat"></div></div>
    </section>
    <section class="panel" aria-labelledby="chart-ship-title">
      <div class="panel-head"><h2 id="chart-ship-title">משלוחים לפי סטטוס</h2><span class="count" id="chart-ship-total"></span></div>
      <div class="panel-body"><div class="vbars" id="chart-ship"></div></div>
    </section>
  </div>

  <section class="panel" aria-labelledby="inv-title">
    <div class="panel-head">
      <h2 id="inv-title">מלאי</h2>
      <div class="filters">
        <label>חיפוש<input type="search" id="f-query" placeholder="שם או מק״ט"></label>
        <label>מחסן<select id="f-warehouse"><option value="">הכול</option></select></label>
        <label>קטגוריה<select id="f-category"><option value="">הכול</option></select></label>
        <label>סטטוס<select id="f-status"><option value="">הכול</option><option value="ok">תקין</option><option value="low">נמוך</option><option value="out">אזל</option></select></label>
      </div>
    </div>
    <div class="panel-body">
      <div class="count" id="inv-count"></div>
      <div class="table-box">
        <table>
          <thead><tr><th>מק״ט</th><th>פריט</th><th>קטגוריה</th><th>מחסן</th><th class="num">כמות</th><th>מול נקודת הזמנה</th><th class="num">שווי ₪</th><th>סטטוס</th></tr></thead>
          <tbody id="inv-body"></tbody>
        </table>
      </div>
    </div>
  </section>
</main>
<script src="data.js"></script>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
